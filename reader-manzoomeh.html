<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کتاب‌خوان منظومه قصص قرآنی</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #252525;
  color: white;
  font-family: Tahoma, sans-serif;
  text-align: center;
}
header {
  padding: 14px 8px;
  background: #173d32;
  font-size: 18px;
}
#counter {
  padding: 10px;
  font-size: 14px;
}
#reader {
  height: calc(100vh - 145px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}
#page {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  touch-action: pan-y;
}
.controls {
  height: 55px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
}
button {
  background: #d4b36a;
  color: #222;
  border: 0;
  border-radius: 8px;
  padding: 10px 22px;
  font-size: 16px;
}
button:disabled {
  opacity: .4;
}
</style>
</head>
<body>

<header>منظومه قصص قرآنی</header>
<div id="counter">صفحه ۱ از ۲۸۰</div>

<div id="reader">
  <img id="page" src="pages/page-001.jpg" alt="صفحه کتاب">
</div>

<div class="controls">
  <button id="next">صفحه بعد</button>
  <button id="prev">صفحه قبل</button>
</div>

<script>
const totalPages = 280;
let currentPage = 1;

const pageImage = document.getElementById("page");
const counter = document.getElementById("counter");
const nextButton = document.getElementById("next");
const prevButton = document.getElementById("prev");

function showPage() {
  const number = String(currentPage).padStart(3, "0");
  pageImage.src = `pages/page-${number}.jpg`;
  counter.textContent = `صفحه ${currentPage} از ${totalPages}`;
  prevButton.disabled = currentPage === 1;
  nextButton.disabled = currentPage === totalPages;
}

function nextPage() {
  if (currentPage < totalPages) {
    currentPage++;
    showPage();
  }
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    showPage();
  }
}

nextButton.addEventListener("click", nextPage);
prevButton.addEventListener("click", prevPage);

let startX = 0;
let startY = 0;

pageImage.addEventListener("touchstart", event => {
  startX = event.changedTouches[0].screenX;
  startY = event.changedTouches[0].screenY;
}, { passive: true });

pageImage.addEventListener("touchend", event => {
  const endX = event.changedTouches[0].screenX;
  const endY = event.changedTouches[0].screenY;
  const diffX = endX - startX;
  const diffY = endY - startY;

  if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
    if (diffX < 0) nextPage();
    else prevPage();
  }
}, { passive: true });

showPage();
</script>

</body>
</html>
