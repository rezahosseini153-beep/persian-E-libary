<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مطالعه منظومه قصص قرآنی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eeeae2;
    font-family: Tahoma, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

header {
    background: #17365d;
    color: white;
    padding: 16px 8px;
    font-size: 19px;
    line-height: 2;
}

.toolbar {
    padding: 15px 5px;
    display: flex;
    justify-content: center;
    gap: 12px;
}

button {
    background: #17365d;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 17px;
}

button:disabled {
    opacity: 0.4;
}

#pageInfo {
    font-size: 19px;
    padding: 12px;
    color: #333;
}

#reader {
    width: 100%;
    padding: 0 10px 25px;
    touch-action: pan-y;
}

#bookPage {
    display: block;
    margin: auto;
    max-width: 100%;
    height: auto;
    background: white;
    box-shadow: 0 3px 15px #aaa;
}

#message {
    color: #a22;
    padding: 15px;
}
</style>
</head>

<body>

<header>
کتابخانه الکترونیکی نورالله
<br>
مطالعه کتاب منظومه قصص قرآنی
</header>

<div class="toolbar">
<button id="prev" disabled>صفحه قبل</button>
<button id="next">صفحه بعد</button>
</div>

<div id="pageInfo">در حال بارگذاری کتاب...</div>

<div id="reader">
<canvas id="bookPage"></canvas>
</div>

<div id="message"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

const PDF_FILE = "yousof.pdf";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfDoc = null;
let pageNum = 1;
let rendering = false;

const canvas = document.getElementById("bookPage");
const ctx = canvas.getContext("2d");

const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const pageInfo = document.getElementById("pageInfo");
const message = document.getElementById("message");

async function renderPage(number) {

    if (rendering) return;

    rendering = true;

    try {

        const page = await pdfDoc.getPage(number);

        const original = page.getViewport({scale: 1});

        const availableWidth =
            Math.min(window.innerWidth - 20, 900);

        const scale = availableWidth / original.width;

        const viewport = page.getViewport({scale});

        const pixelRatio = Math.min(
            window.devicePixelRatio || 1,
            2.5
        );

        canvas.width = Math.floor(viewport.width * pixelRatio);
        canvas.height = Math.floor(viewport.height * pixelRatio);

        canvas.style.width = viewport.width + "px";
        canvas.style.height = viewport.height + "px";

        await page.render({
            canvasContext: ctx,
            viewport: viewport,
            transform: [
                pixelRatio, 0,
                0, pixelRatio,
                0, 0
            ]
        }).promise;

        pageInfo.textContent =
            "صفحه " + number + " از " + pdfDoc.numPages;

        prevBtn.disabled = number <= 1;
        nextBtn.disabled = number >= pdfDoc.numPages;

    } catch (error) {

        message.textContent = "خطا در نمایش صفحه کتاب.";
        console.error(error);

    } finally {
        rendering = false;
    }
}

function changePage(direction) {

    if (!pdfDoc || rendering) return;

    const newPage = pageNum + direction;

    if (newPage < 1 || newPage > pdfDoc.numPages) return;

    pageNum = newPage;
    renderPage(pageNum);
}

prevBtn.addEventListener("click", () => {
    changePage(-1);
});

nextBtn.addEventListener("click", () => {
    changePage(1);
});

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", function(event) {

    if (event.touches.length !== 1) return;

    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;

}, {passive: true});

canvas.addEventListener("touchend", function(event) {

    if (event.changedTouches.length !== 1) return;

    const endX = event.changedTouches[0].clientX;
    const endY = event.changedTouches[0].clientY;

    const differenceX = endX - touchStartX;
    const differenceY = endY - touchStartY;

    if (
        Math.abs(differenceX) > 60 &&
        Math.abs(differenceX) > Math.abs(differenceY) * 1.3
    ) {

        if (differenceX < 0) {
            changePage(1);
        } else {
            changePage(-1);
        }

    }

}, {passive: true});

pdfjsLib.getDocument(PDF_FILE).promise

.then(function(pdf) {

    pdfDoc = pdf;
    renderPage(pageNum);

})

.catch(function(error) {

    pageInfo.textContent = "";
    message.textContent = "بارگذاری کتاب با مشکل روبه‌رو شد.";

    console.error(error);

});

</script>

</body>
</html>
