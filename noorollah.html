<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کتابخانه الکترونیکی نورالله</title>
<style>
body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    background: #f5f2eb;
    color: #26352d;
}
header {
    background: #174b3a;
    color: white;
    text-align: center;
    padding: 30px 15px;
}
header h1 { margin: 0 0 10px; }
.search {
    text-align: center;
    padding: 25px 10px;
}
input {
    width: 80%;
    max-width: 450px;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}
.books {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}
.book {
    background: white;
    width: 190px;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 12px #00000012;
}
.cover {
    background: #dce9df;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #174b3a;
    border-radius: 8px;
}
button {
    background: #174b3a;
    color: white;
    border: 0;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
}
footer {
    text-align: center;
    padding: 25px;
    color: #666;
}
</style>
</head>
<body>

<header>
<h1>کتابخانه الکترونیکی نورالله</h1>
<p>دنیایی از کتاب، دانش و دانایی</p>
</header>

<div class="search">
<input id="search" type="text" placeholder="نام کتاب را جست‌وجو کنید..." oninput="searchBooks()">
</div>

<section class="books" id="books">
<div class="book">
<div class="cover">📚</div>
<h3>کتاب نغمه</h3>
<p>نمونه کتاب</p>
<button>مشاهده کتاب</button>
</div>

<div class="book">
<div class="cover">📖</div>
<h3>کتاب دانش</h3>
<p>نمونه کتاب</p>
<button>مشاهده کتاب</button>
</div>

<div class="book">
<div class="cover">📕</div>
<h3>کتاب داستان</h3>
<p>نمونه کتاب</p>
<button>مشاهده کتاب</button>
</div>
</section>

<footer>
کتابخانه الکترونیکی نورالله
</footer>

<script>
function searchBooks() {
    const value = document.getElementById('search').value;
    document.querySelectorAll('.book').forEach(book => {
        book.style.display = book.innerText.includes(value) ? '' : 'none';
    });
}
</script>

</body>
</html>
